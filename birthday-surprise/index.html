<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Sister!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-wrap">
    <div class="hero">
      <div class="stars">
        <span class="star star-1"></span>
        <span class="star star-2"></span>
        <span class="star star-3"></span>
        <span class="star star-4"></span>
        <span class="star star-5"></span>
        <span class="star star-6"></span>
      </div>
      <div class="balloon balloon-1"></div>
      <div class="balloon balloon-2"></div>
      <div class="balloon balloon-3"></div>
      <div class="balloon balloon-4"></div>
      <div class="balloon balloon-5"></div>
      <div class="greeting-card" id="card">
        <div class="sparkle"></div>
        <h1>Happy Birthday, Little Sister!</h1>
        <p>You are sunshine, joy, and endless smiles.</p>
        <div class="gif-row">
          <div class="gif-card">
            <img src="https://media.giphy.com/media/l0MYu5ZJD9lHqoX0A/giphy.gif" alt="Birthday Cake GIF">
            <p>Make a wish with cake!</p>
          </div>
          <div class="gif-card">
            <img src="https://media.giphy.com/media/xUPGcguWZHRC2HyBRS/giphy.gif" alt="Party Popper GIF">
            <p>Party popper celebration!</p>
          </div>
        </div>
        <button id="surpriseBtn">Open Your Surprise</button>
      </div>
    </div>
    <div class="message-panel hidden" id="messagePanel">
      <div class="message-stars">
        <span class="star small"></span>
        <span class="star small"></span>
        <span class="star small"></span>
      </div>
      <h2>🎉 Surprise! 🎉</h2>
      <p>Wishing you a day filled with laughter, love, and magical moments.</p>
      <p>May your year glow brighter than the candles and sparkle more than the stars.</p>
      <div class="celebration-gif">
        <img src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" alt="Celebration GIF">
      </div>
      <div class="gift">💖</div>
    </div>
  </div>
  <canvas id="confettiCanvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
